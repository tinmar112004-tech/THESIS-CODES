<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue.js CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div id="app" class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
    <!-- Header -->
    <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">
      Forgot Password
    </h2>
    <p class="text-gray-600 text-center mb-6">
      Enter your email address and we’ll send you a link to reset your password.
    </p>

    <!-- Form -->
    <form @submit.prevent="handleSubmit" class="space-y-5" v-if="!submitted">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">
          Email Address
        </label>
        <input 
          type="email" 
          id="email" 
          v-model="email"
          required
          class="mt-2 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
          placeholder="you@example.com"
        >
      </div>

      <button 
        type="submit" 
        class="w-full bg-[#11375E] text-white py-2 rounded-lg hover:bg-blue-700 transition">
        Send Reset Link
      </button>
    </form>

    <!-- Success Message -->
    <div v-else class="text-center">
      <h3 class="text-lg font-semibold text-green-600 mb-4">
        Reset link sent!
      </h3>
      <p class="text-gray-700 mb-6">
        Please check your inbox for instructions to reset your password.
      </p>
      <a href="loginpage.html" class="text-blue-600 hover:underline">
        Back to Login
      </a>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          email: "",
          submitted: false
        };
      },
      methods: {
        handleSubmit() {
          // Simulate sending reset link
          if (this.email) {
            this.submitted = true;
            console.log("Reset link sent to:", this.email);
          }
        }
      }
    }).mount("#app");
  </script>

</body>
</html>
