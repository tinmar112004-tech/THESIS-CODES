<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans bg-[#f8fbff] text-[#1a5276]">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-[250px] bg-gradient-to-br from-[#11375E] to-[#2980b9] text-white p-5 shadow-lg overflow-y-auto">
      <div class="text-center border-b border-white/20 mb-5">
        <h2 class="text-2xl font-bold tracking wide">Generate</h2>
        <h2 class="text-2xl font-bold tracking wide">Reports</h2>
      </div>
      <nav>
        <ul>
          <li><a href="admindashboardpage.html" class="block px-5 py-3 text-white/80 hover:bg-white/10 hover:text-white border-l-4 border-transparent hover:border-[#3498db] transition-all duration-300 ease-in-out hover:translate-x-1">Home</a></li>
          <li><a href="#" class="block px-5 py-3 text-white/80 hover:bg-white/10 hover:text-white border-l-4 border-transparent hover:border-[#3498db] transition-all duration-300 ease-in-out hover:translate-x-1">Analytics</a></li>
          <li><a href="#" class="block px-5 py-3 text-white/80 hover:bg-white/10 hover:text-white border-l-4 border-transparent hover:border-[#3498db] transition-all duration-300 ease-in-out hover:translate-x-1">Reports</a></li>
          <li><a href="#" class="block px-5 py-3 text-white/80 hover:bg-white/10 hover:text-white border-l-4 border-transparent hover:border-[#3498db] transition-all duration-300 ease-in-out hover:translate-x-1">Pending</a></li>
          <li><a href="loginpage.html" class="block px-5 py-3 text-white/80 hover:bg-white/10 hover:text-white border-l-4 border-transparent hover:border-[#3498db] transition-all duration-300 ease-in-out hover:translate-x-1">Logout</a></li>
        </ul>
      </nav>
     </aside>

      <!-- Main -->
  <main class="flex-1 py-5 px-4 overflow-y-auto">
    <div class="max-w-[960px] mx-auto px-4 flex flex-col lg:flex-row gap-5">

      <!-- Left Column -->
      <div class="flex-2 min-w-0">

        <!-- Controls -->
        <section class="flex flex-wrap gap-3 items-end pb-5 border-b border-blue-100">
          <div class="flex flex-col min-w-[160px]">
            <label for="startDate" class="text-sm text-gray-700 mb-1">Start date</label>
            <input id="startDate" type="date" class="px-2 py-2 border border-blue-200 rounded bg-white" />
          </div>
          <div class="flex flex-col min-w-[160px]">
            <label for="endDate" class="text-sm text-gray-700 mb-1">End date</label>
            <input id="endDate" type="date" class="px-2 py-2 border border-blue-200 rounded bg-white" />
          </div>
          <div class="flex flex-col min-w-[160px]">
            <label for="reportType" class="text-sm text-gray-700 mb-1">Report type</label>
            <select id="reportType" class="px-2 py-2 border border-blue-200 rounded bg-white">
              <option>Feedback</option>
              <option>Approval for Replacement</option>
              <option>Defective</option>
            </select>
          </div>
          <div class="flex gap-2">
            <button class="px-3 py-2 rounded bg-[#11375E] text-white hover:-translate-y-0.5 hover:shadow-lg transition">Generate</button>
            <button class="px-3 py-2 rounded border border-blue-200 text-[#11375E] hover:bg-blue-50 transition">Export</button>
          </div>
        </section>

        <!-- Report Sections -->
        <section id="feedbackSection" class="bg-gray-100 p-5 rounded mb-5 mt-5 hidden">
          <h2 class="text-lg text-gray-800 mb-4">Feedback</h2>
        </section>

        <section id="replacementSection" class="bg-gray-100 p-5 rounded mb-5 mt-5 hidden">
          <h2 class="text-lg text-gray-800 mb-4">Approval for Replacement</h2>
        </section>

        <section id="defectiveSection" class="bg-gray-100 p-5 rounded mb-5 mt-5 hidden">
          <h2 class="text-lg text-gray-800 mb-4">Defective</h2>
        </section>

      </div>

      <!-- Right Column -->
      <div class="w-full lg:w-[350px] flex-shrink-0">
        <section class="bg-gray-100 p-5 rounded mb-5">
          <h2 class="text-lg text-gray-800 mb-4 font-bold">Report Filtering</h2>

          <div class="grid gap-4 mb-4">
            <div class="flex flex-col">
              <label for="productGroup" class="text-sm text-gray-700 mb-1 font-medium">Product Group</label>
              <select id="productGroup" class="px-2 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-[#11375E]">
                <option>Select Product Group</option>
              </select>
            </div>
            <div class="flex flex-col">
              <label for="productType" class="text-sm text-gray-700 mb-1 font-medium">Product Type</label>
              <select id="productType" class="px-2 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-[#11375E]">
                <option>Select Product Type</option>
              </select>
            </div>
            <div class="flex flex-col">
              <label for="model" class="text-sm text-gray-700 mb-1 font-medium">Model</label>
              <select id="model" class="px-2 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-[#11375E]">
                <option>Select Model</option>
              </select>
            </div>
          </div>

          <div class="grid gap-4 mb-4">
            <div class="flex flex-col">
              <label for="asc" class="text-sm text-gray-700 mb-1 font-medium">Authorised Service Center</label>
              <select id="asc" class="px-2 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-[#11375E]">
                <option>Select ASC...</option>
              </select>
            </div>
            <div class="flex flex-col">
              <label for="startCallDate" class="text-sm text-gray-700 mb-1 font-medium">Start Call Date *</label>
              <input id="startCallDate" type="date" class="px-2 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-[#11375E]" />
            </div>
            <div class="flex flex-col">
              <label for="endCallDate" class="text-sm text-gray-700 mb-1 font-medium">End Call Date *</label>
              <input id="endCallDate" type="date" class="px-2 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-[#11375E]" />
            </div>
          </div>

          <div class="mt-4">
            <button class="bg-[#11375E] text-white px-6 py-2 rounded hover:bg-[#0d2844] hover:-translate-y-0.5 hover:shadow-lg transition">PRINT</button>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="fixed bottom-0 left-0 w-full py-4 text-center text-gray-500 text-sm">
    © GTC-Aldis Philippines, Inc. — Reports
  </footer>

  <!-- Script -->
  <script>
    document.getElementById('reportType').addEventListener('change', function() {
      document.getElementById('feedbackSection').classList.add('hidden');
      document.getElementById('replacementSection').classList.add('hidden');
      document.getElementById('defectiveSection').classList.add('hidden');

      const selected = this.value;
      if (selected === 'Feedback') {
        document.getElementById('feedbackSection').classList.remove('hidden');
      } else if (selected === 'Approval for Replacement') {
        document.getElementById('replacementSection').classList.remove('hidden');
      } else if (selected === 'Defective') {
        document.getElementById('defectiveSection').classList.remove('hidden');
      }
    });
  </script>

  
</body>
</html>
