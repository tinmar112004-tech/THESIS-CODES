<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script src="scripts/scripts.js" defer></script>
</head>
<body>
    <div id="Dashboard">
        <div id="NavigationBar">
            <nav>
                <header id="NavHead">
                    <h3>Admin Dashboard</h3>
                </header>
                <div id="NavLinks">
                    <button id="Navbtn">Home</button>
                    <button id="Navbtn">Analytics</button>
                    <button id="Navbtn">Pending</button>
                    <button id="Navbtn">Logout</button>
                </div>
            </nav>
        </div>
        <div id="ContentArea">    
            <header id="ContentHead">
                <div id="headtxt"><h3>Welcome Back, User</h3></div>
                <div id="functions">
                    <div id="search">
                        <input type="text" placeholder="Search...">
                        <button type="submit">Search</button>
                    </div>
                    <div id="user-profile">
                        <img src="images/profile.jpg" alt="User Profile">
                    </div>
                </div>
            </header>
            <main id="MainContent">
                <div id="Analytics">    
                    <div id="Defective"><h6>Defective</h6></div>
                    <div id="Replacement"><h6>Replacement</h6></div>
                </div>
                <div id="Pending">
                    <div id="PendingList">
                        <h3 id="Pendingheader">Pending</h3>
                        <p>Item 1</p>
                        <p>Item 2</p>
                        <p>Item 3</p>
                        <p>Item 4</p>
                        <p>Item 5</p>
                        <p>Item 6</p>
                        <p>Item 7</p>
                        <p>Item 8</p>
                        <p>Item 9</p>
                        <p>Item 10</p>
                    </div>   
                </div>
            </main>
            
        </div>
    </div>
</body>
</html>
